# Paper ablation: CMCA×2 removed from FPN
# Removes spatial-channel attention enhancement from FPN path
# Purpose: validate CMCA's contribution to small-target feature fusion

nc: 5
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                          # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                          # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]                   # 2
  - [-1, 1, Conv, [256, 3, 2]]                          # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]                   # 4
  - [-1, 1, Conv, [512, 3, 2]]                          # 5  P4/16
  - [-1, 2, C3k2, [512, True]]                          # 6
  - [-1, 1, Conv, [1024, 3, 2]]                         # 7  P5/32
  - [-1, 1, SwinTransformerBlock_v2a, [1024]]            # 8  LCAT#1
  - [-1, 1, SwinTransformerBlock_v2a, [1024]]            # 9  LCAT#2
  - [-1, 1, SPPF, [1024, 5]]                            # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]          # 11
  - [[-1, 6], 1, Concat, [1]]                            # 12 cat P4 backbone
  - [-1, 2, C3k2, [512, False]]                         # 13 FPN P4 (no SM)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]          # 14
  - [[-1, 4], 1, Concat, [1]]                            # 15 cat P3 backbone
  - [-1, 2, C3k2, [256, False]]                         # 16 FPN P3 (no SM)

  - [-1, 1, Conv, [256, 3, 2]]                          # 17 PAN P4 downsample
  - [[-1, 13], 1, Concat, [1]]                          # 18 cat FPN P4
  - [-1, 2, MSBlock, [512, [1, 5, 7], 1.0, 2.0, 1, False, 3, 3]]  # 19 MS#1 PAN P4

  - [-1, 1, Conv, [512, 3, 2]]                          # 20 PAN P5 downsample
  - [[-1, 10], 1, Concat, [1]]                           # 21 cat P5 SPPF
  - [-1, 2, MSBlock, [1024, [1, 7, 9], 1.0, 2.0, 1, False, 3, 3]] # 22 MS#2 PAN P5

  - [[16, 19, 22], 1, Detect, [nc]]
