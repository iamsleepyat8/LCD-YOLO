# Paper ablation: DS-MSBlock×2 → C3k2×2 in PAN
# Removes multi-scale branch aggregation from PAN path, reverts to C3k2
# Purpose: validate DS-MSBlock's contribution to PAN multi-scale feature aggregation

nc: 5
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                          # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                          # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]                   # 2
  - [-1, 1, Conv, [256, 3, 2]]                          # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]                   # 4
  - [-1, 1, Conv, [512, 3, 2]]                          # 5  P4/16
  - [-1, 2, C3k2, [512, True]]                          # 6
  - [-1, 1, Conv, [1024, 3, 2]]                         # 7  P5/32
  - [-1, 1, SwinTransformerBlock_v2a, [1024]]            # 8  LCAT#1
  - [-1, 1, SwinTransformerBlock_v2a, [1024]]            # 9  LCAT#2
  - [-1, 1, SPPF, [1024, 5]]                            # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]          # 11
  - [[-1, 6], 1, Concat, [1]]                            # 12 cat P4 backbone
  - [-1, 2, C3k2, [512, False]]                         # 13 FPN P4
  - [-1, 1, SM_block_v2a, [512]]                         # 14 SM#1 FPN P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]          # 15
  - [[-1, 4], 1, Concat, [1]]                            # 16 cat P3 backbone
  - [-1, 2, C3k2, [256, False]]                         # 17 FPN P3
  - [-1, 1, SM_block_v2a, [256]]                         # 18 SM#2 FPN P3

  - [-1, 1, Conv, [256, 3, 2]]                          # 19 PAN P4 downsample
  - [[-1, 14], 1, Concat, [1]]                          # 20 cat SM-enhanced FPN P4
  - [-1, 2, C3k2, [512, False]]                         # 21 C3k2 (was MS#1 PAN P4)

  - [-1, 1, Conv, [512, 3, 2]]                          # 22 PAN P5 downsample
  - [[-1, 10], 1, Concat, [1]]                           # 23 cat P5 SPPF
  - [-1, 2, C3k2, [1024, False]]                        # 24 C3k2 (was MS#2 PAN P5)

  - [[18, 21, 24], 1, Detect, [nc]]
